name: Valgrind (on-demand)

# On-demand memcheck (valgrind) run for a pull request.
#
# The full valgrind suite otherwise runs only on the nightly daily.yml schedule
# and on PRs that do NOT target `unstable`, so a PR targeting `unstable` (the
# common case) gets no valgrind coverage until the nightly run. A maintainer
# adds the `run-valgrind` label to a PR to run the suite against that PR on
# demand; the label is removed afterwards so it is a one-shot button.
#
# The valgrind build/test recipe is NOT duplicated here: this workflow just
# calls the reusable valgrind.yml with the PR's merge commit.

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: valgrind-on-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  valgrind:
    # React only to our label, and only on the canonical repo: pull_request_target
    # runs in the base-repo context with the base repo's token, so forks carrying
    # this file must never execute it.
    if: |
      github.event.label.name == 'run-valgrind' &&
      github.repository == 'valkey-io/valkey'
    permissions:
      contents: read
    # Run the suite against the code that would land (the PR merge commit).
    uses: ./.github/workflows/valgrind.yml
    with:
      repo: ${{ github.repository }}
      git_ref: ${{ github.event.pull_request.merge_commit_sha }}

  report:
    # Summarize the result on the PR and remove the label (one-shot trigger).
    needs: valgrind
    if: always() && github.event.label.name == 'run-valgrind' && github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with valgrind result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = '${{ needs.valgrind.result }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const emoji = result === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **On-demand valgrind (memcheck)**: **${result}** for \`${sha}\`.\n\n`
                  + `Download the \`test-failures\` artifacts on the run for any leak / uninitialised-value reports.`
            });

      - name: Remove run-valgrind label
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'run-valgrind'
            }).catch(err => console.log('label not present:', err.message));
