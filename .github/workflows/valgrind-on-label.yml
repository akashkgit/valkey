name: Valgrind (on-demand)

# On-demand memcheck (valgrind) run for a pull request.
#
# The full valgrind suite only runs on the nightly `daily.yml` schedule and on
# PRs that do NOT target `unstable`. That leaves a gap: a PR targeting
# `unstable` (the common case) cannot get valgrind coverage without waiting for
# the nightly run. This workflow closes that gap: a maintainer adds the
# `run-valgrind` label to a PR to run the memcheck suite against that PR on
# demand, and the label is removed afterwards so it behaves as a one-shot
# button (re-add to re-run).
#
# It mirrors the four valgrind jobs in daily.yml (test / misc, each in a normal
# and a NO_MALLOC_USABLE_SIZE build) as a single matrix. See the PR description
# for a point-by-point comparison with daily.yml.

on:
  pull_request_target:
    types: [labeled]

# One in-flight valgrind run per PR; a newer trigger cancels the older one.
concurrency:
  group: valgrind-on-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  valgrind:
    # Only react to our label, and only on the canonical repo: pull_request_target
    # runs in the base-repo context with the base repo's token, so forks that
    # happen to carry this file must never execute it.
    if: |
      github.event.label.name == 'run-valgrind' &&
      github.repository == 'valkey-io/valkey'

    name: valgrind (${{ matrix.variant }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        # Mirrors daily.yml: the `test` jobs shard the TCL suite into
        # unit / cluster / integration-type; the `misc` shard is daily.yml's
        # module-api + C unit (gtest) tests under valgrind.
        shard: ["unit", "cluster", "integration-type", "misc"]
        # Mirrors daily.yml's two build variants: the normal valgrind build and
        # the NO_MALLOC_USABLE_SIZE build (which exercises the fallback size
        # bookkeeping and catches a distinct class of allocator bugs).
        variant: ["default", "no-malloc-usable-size"]

    steps:
      # Check out the PR's merge commit (the code that would land), not the base
      # branch. persist-credentials:false drops the token from the checkout since
      # the build/test needs no authenticated git access.
      - name: Checkout PR merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      # Same libbacktrace pin as daily.yml, for symbolized valgrind stack traces
      # (USE_LIBBACKTRACE=yes below).
      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace
          persist-credentials: false
      - run: cd libbacktrace && ./configure && make && sudo make install

      - name: Install dependencies
        run: |
          sudo apt-get update
          # tcl/valgrind: run the suite under memcheck. gtest/gmock: only the
          # `misc` shard builds and runs the C unit tests. libzstd-dev: only the
          # default variant builds with ZSTD (matches daily.yml, where the
          # no-malloc-usable-size valgrind build omits BUILD_ZSTD).
          sudo apt-get install -y tcl8.6 tclx valgrind
          if [ "${{ matrix.variant }}" = "default" ]; then
            sudo apt-get install -y libzstd-dev
          fi
          if [ "${{ matrix.shard }}" = "misc" ]; then
            sudo apt-get install -y pkg-config libgtest-dev libgmock-dev
          fi

      # Build the valgrind target. Each command below is identical (flag order
      # included) to the corresponding daily.yml valgrind job, so they can be
      # reviewed side by side:
      #   default      test  -> test-valgrind-test
      #   default      misc  -> test-valgrind-misc
      #   no-malloc    test  -> test-valgrind-no-malloc-usable-size-test
      #   no-malloc    misc  -> test-valgrind-no-malloc-usable-size-misc
      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = "default" ]; then
            if [ "${{ matrix.shard }}" = "misc" ]; then
              make valgrind all-with-unit-tests SERVER_CFLAGS='-Werror' BUILD_ZSTD=yes USE_LIBBACKTRACE=yes
            else
              make valgrind SERVER_CFLAGS='-Werror' BUILD_ZSTD=yes USE_LIBBACKTRACE=yes
            fi
          else
            if [ "${{ matrix.shard }}" = "misc" ]; then
              make valgrind all-with-unit-tests CFLAGS="-DNO_MALLOC_USABLE_SIZE" SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes
            else
              make valgrind CFLAGS="-DNO_MALLOC_USABLE_SIZE" SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes
            fi
          fi

      # Run the suite under valgrind. The runtest / runtest-moduleapi / gtest
      # commands below are kept identical (flag order included) to the matching
      # daily.yml valgrind jobs, so they diff cleanly side by side.
      - name: Test
        run: |
          if [ "${{ matrix.shard }}" = "misc" ]; then
            # daily.yml test-valgrind-misc: module-api tests + C unit tests.
            CFLAGS='-Werror' ./runtest-moduleapi --valgrind --no-latency --failures-output test-failures/moduleapi.json --verbose --clients 1 --timeout 2400 --dump-logs
            if [ -f ./src/unit/valkey-unit-gtests ]; then
              ./deps/gtest-parallel/gtest-parallel valgrind -- --track-origins=yes --suppressions=./src/valgrind.sup --show-reachable=no --show-possibly-lost=no --leak-check=full --log-file=err.%p.txt ./src/unit/valkey-unit-gtests --valgrind
              if grep -qlE '0x[0-9A-Fa-f]+:' err.*.txt 2>/dev/null; then grep -lE '0x[0-9A-Fa-f]+:' err.*.txt | xargs cat; exit 1; fi
            elif [ -f ./src/valkey-unit-tests ]; then
              valgrind --track-origins=yes --suppressions=./src/valgrind.sup --show-reachable=no --show-possibly-lost=no --leak-check=full --log-file=err.txt ./src/valkey-unit-tests --valgrind
              if grep -q 0x err.txt; then cat err.txt; exit 1; fi
            fi
          else
            # daily.yml test-valgrind-test shards.
            case "${{ matrix.shard }}" in
              unit) shard_args=(--single tests/unit) ;;
              cluster) shard_args=(--single tests/unit/cluster) ;;
              integration-type) shard_args=(--single tests/integration --single tests/unit/type) ;;
            esac
            ./runtest --valgrind --no-latency --failures-output test-failures/valkey.json --verbose --clients 1 --timeout 2400 --dump-logs "${shard_args[@]}"
          fi

      # Same artifact upload action daily.yml uses, so failing-test logs are
      # downloadable from the run.
      - name: Upload test failures
        if: always()
        uses: ./.github/actions/upload-test-failures
        with:
          job-name: valgrind-${{ matrix.variant }}-${{ matrix.shard }}

  # Post a single pass/fail summary comment on the PR, then remove the label so
  # the run is one-shot (re-add `run-valgrind` to run again).
  report:
    needs: valgrind
    if: always() && github.event.label.name == 'run-valgrind' && github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with valgrind result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = '${{ needs.valgrind.result }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const emoji = result === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **On-demand valgrind (memcheck)**: **${result}** for \`${sha}\`.\n\n`
                  + `Shards: unit, cluster, integration-type, misc × { default, no-malloc-usable-size }. `
                  + `Download the \`test-failures\` artifacts on the run for any leak / uninitialised-value reports.`
            });

      - name: Remove run-valgrind label
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'run-valgrind'
            }).catch(err => console.log('label not present:', err.message));
